
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SRIRAM Jewellers | Gold Jewellery</title>

    <link
        rel="icon"
        type="image/webp"
        href="images/logo.webp"
    >

    <link rel="stylesheet" href="style.css">

    <script src="data.js" defer></script>
    <script src="script.js" defer></script>
</head>
<div id="photoViewer" class="photo-viewer" hidden>
    <button id="closePhotoViewer">✕</button>
    <img id="largePhoto" src="" alt="Jewellery">
</div>
<body>
     <div id="splashScreen">
        <img src="images/logo.png" alt="SRIRAM Jewellers Logo">
    </div>

    <header class="shop-banner" id="shopBanner">


    <img
        src="images/logo.png"
        alt="Sriram Jewellers"
        class="shop-logo">
         <h1 id="shopName">Sriram Jewellers</h1>
        <p id="shopAddress">Gangasaram,Donkeshwar,Nizamabad,Telangana</p>

        <p id="shopOwner">srirammahipal</p>

        <p id="shopPhone">9848068596</p>
        <div class="contact-buttons">

    <a href="tel:9848068596" class="contact-button call-button">
        📞 Call
    </a>


    <a
        href="https://www.google.com/maps/dir/?api=1&destination=Gangasaram,Donkeshwar,Nizamabad,Telangana"
        target="_blank"
        class="contact-button maps-button"
    >
        📍 Directions
    </a>

</div>

    </header>

    <section class="gold-rate-bar" id="goldRateBar">

        <div>
            <span>24K</span>
            <p id="rate24">Loading...</p>
        </div>

        <div>
            <span>22K</span>
            <p id="rate22">Loading...</p>
        </div>

        <div>
            <span>18K</span>
            <p id="rate18">Loading...</p>
        </div>

    </section>
    <nav class="menu-bar">

    <button id="menuButton" aria-label="Open menu">
        ☰
    </button>

    <h2>Gold Collection</h2>

</nav>
<div class="search-container">

    <input
        type="search"
        id="searchInput"
        placeholder="Search jewellery..."
        autocomplete="off"
    >

    <button id="clearSearch" type="button">✕</button>

</div>

    <!-- MENU DRAWER -->
<aside id="menuDrawer" class="menu-drawer" aria-label="Categories" aria-hidden="true">

    <button id="closeMenu" aria-label="Close menu">
        ✕
    </button>

    <h2>Categories</h2>

    <!-- All Designs -->
    <button id="allDesigns" class="all-designs">
        All Designs
    </button>

    <!-- Categories generated by JavaScript -->
    <div id="categoryList"></div>

</aside>


    <!-- 4. MAIN CONTENT -->
    <main id="mainContent">

        <!-- HOME PAGE -->
        <section id="homePage">

            <h2>Our Jewellery Collection</h2>

            <div id="designGrid">

                <!-- Jewellery designs will appear here -->

            </div>

        </section>


        <!-- SUBCATEGORY PAGE -->
        <section id="subcategoryPage" hidden>

            <h2 id="subcategoryTitle"></h2>

            <div id="subcategoryDesigns">

                <!-- Selected subcategory designs will appear here -->

            </div>

        </section>

    </main>


    <!-- 5. DARK BACKDROP -->
    <div id="backdrop" class="backdrop" hidden></div>


    <!-- 6. MENU DRAWER -->
    <aside id="menuDrawer" class="menu-drawer" aria-label="Categories" aria-hidden="true">

        <button id="closeMenu" aria-label="Close menu">
            ✕
        </button>

        <h2>Categories</h2>

        <!-- Categories will be added using JavaScript -->

        <div id="categoryList"></div>

    </aside>


<!-- =====================================
     DAY 11 - IMAGE POPUP
===================================== -->

<div id="imagePopup" class="image-popup" hidden>

    <div class="popup-content">

        <!-- CLOSE BUTTON -->
        <button id="closePopup" type="button" aria-label="Close">
            ✕
        </button>

        <!-- DETAILS -->
        <div id="popupDetails" class="popup-details">
        </div>

        <!-- IMAGE -->
        <img
            id="popupImage"
            src=""
            alt="Jewellery design"
        >

        <!-- PREVIOUS / NEXT -->
        <div class="popup-navigation">

            <button id="prevDesign" type="button">
                ← Previous
            </button>

            <button id="nextDesign" type="button">
                Next →
            </button>

        </div>

        <!-- WHATSAPP -->
        <a
            id="whatsappButton"
            class="whatsapp-button"
            href="#"
        >
            Enquire on WhatsApp
        </a>

    </div>

</div>

</body>
</html>
